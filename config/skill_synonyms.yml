# Synonym/alias table for skill-name normalization.
# Each canonical skill maps to the alternate spellings/abbreviations a JD or
# resume might use for the SAME underlying skill. This is a re-labeling
# lookup only - it must never be used to infer a DIFFERENT skill the
# candidate never claimed (e.g. "containers" does not imply "kubernetes").

python: ["python3", "py"]
javascript: ["js", "es6", "ecmascript"]
typescript: ["ts"]
"c++": ["cpp", "cplusplus"]
"c#": ["csharp", "c sharp"]
